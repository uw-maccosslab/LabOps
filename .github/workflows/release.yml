# Release - triggered by a v* tag. Builds the installer and publishes the GitHub Release that the
# app's update check reads. Do not hand-create the Release. See release-notes/README.md.
#
# Adapted from PanoramaBridge's release.yml. The differences: .NET 10, and pinned uv and gh builds
# are downloaded, checked against their published SHA-256 sums, and shipped inside the app
# (tools\), so users never install either one.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  UV_VERSION: "0.12.23"
  GH_VERSION: "2.102.0"

jobs:
  release:
    name: Build, pack and publish
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      # The version lives in one place, Directory.Build.props, and a tagged build must agree
      # with it. A tag containing "beta" publishes to the beta channel only. LabOps has its own
      # channels, stable and beta (ChargeState's were win and win-beta), so the ChargeState app never
      # takes a LabOps release for one of its own (AppInfo.UpdateChannel).
      - name: Resolve and verify version
        id: meta
        shell: bash
        run: |
          PROPS=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props | tr -d '[:space:]')
          if [ -z "$PROPS" ]; then
            echo "::error::Could not read <Version> from Directory.Build.props"
            exit 1
          fi
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME#v}"
            if [ "$TAG" != "$PROPS" ]; then
              echo "::error::Directory.Build.props Version ($PROPS) does not match tag ($TAG). Bump the property, commit, then re-tag."
              exit 1
            fi
            VERSION="$TAG"
          else
            VERSION="$PROPS"
          fi
          case "$VERSION" in *beta*) CHANNEL=beta ;; *) CHANNEL=stable ;; esac
          case "$VERSION" in *alpha*|*beta*|*rc*) PRERELEASE=true ;; *) PRERELEASE=false ;; esac
          {
            echo "version=$VERSION"
            echo "channel=$CHANNEL"
            echo "prerelease=$PRERELEASE"
          } >> "$GITHUB_OUTPUT"
          echo "version=$VERSION channel=$CHANNEL prerelease=$PRERELEASE"

      - name: Locate the release notes
        id: notes
        shell: bash
        run: |
          NOTES="release-notes/RELEASE_NOTES_v${{ steps.meta.outputs.version }}.md"
          if [ ! -f "$NOTES" ]; then
            echo "::error::Expected release notes at $NOTES. Rename the draft (release-notes/RELEASE_NOTES_next.md) before tagging - see release-notes/README.md."
            exit 1
          fi
          echo "notes=$NOTES" >> "$GITHUB_OUTPUT"

      - name: Test
        run: dotnet test --project src/LabOps.Tests/LabOps.Tests.csproj -c Release

      # Each download is checked against the checksum its project publishes, so a tampered or
      # truncated file fails the release instead of reaching users.
      - name: Download uv and gh
        shell: pwsh
        run: |
          $tools = 'src/LabOps.App/tools'
          New-Item -ItemType Directory -Force $tools, "$env:RUNNER_TEMP/dl" | Out-Null

          $uvZip = "$env:RUNNER_TEMP/dl/uv.zip"
          $uvBase = "https://github.com/astral-sh/uv/releases/download/$env:UV_VERSION/uv-x86_64-pc-windows-msvc.zip"
          Invoke-WebRequest $uvBase -OutFile $uvZip
          # Checksum files are saved and read as text: GitHub serves them as binary, so
          # Invoke-WebRequest's .Content would be a byte array, not the hash.
          Invoke-WebRequest "$uvBase.sha256" -OutFile "$env:RUNNER_TEMP/dl/uv.sha256"
          $uvExpected = ((Get-Content "$env:RUNNER_TEMP/dl/uv.sha256" -Raw).Trim() -split '\s+')[0]
          if ((Get-FileHash $uvZip -Algorithm SHA256).Hash -ne $uvExpected.ToUpper()) { throw "uv checksum mismatch" }
          Expand-Archive $uvZip "$env:RUNNER_TEMP/dl/uv" -Force
          Copy-Item (Get-ChildItem "$env:RUNNER_TEMP/dl/uv" -Recurse -Filter uv.exe | Select-Object -First 1).FullName $tools

          $ghName = "gh_$($env:GH_VERSION)_windows_amd64.zip"
          $ghZip = "$env:RUNNER_TEMP/dl/$ghName"
          Invoke-WebRequest "https://github.com/cli/cli/releases/download/v$env:GH_VERSION/$ghName" -OutFile $ghZip
          Invoke-WebRequest "https://github.com/cli/cli/releases/download/v$env:GH_VERSION/gh_$($env:GH_VERSION)_checksums.txt" -OutFile "$env:RUNNER_TEMP/dl/gh-sums.txt"
          $sums = Get-Content "$env:RUNNER_TEMP/dl/gh-sums.txt" -Raw
          $ghExpected = ($sums -split "`n" | Where-Object { $_ -match [regex]::Escape($ghName) } | ForEach-Object { ($_ -split '\s+')[0] })
          if (-not $ghExpected -or (Get-FileHash $ghZip -Algorithm SHA256).Hash -ne $ghExpected.ToUpper()) { throw "gh checksum mismatch" }
          Expand-Archive $ghZip "$env:RUNNER_TEMP/dl/gh" -Force
          Copy-Item (Get-ChildItem "$env:RUNNER_TEMP/dl/gh" -Recurse -Filter gh.exe | Select-Object -First 1).FullName $tools

          Get-ChildItem $tools | Format-Table Name, Length

      - name: Publish
        run: >
          dotnet publish src/LabOps.App/LabOps.App.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishReadyToRun=true
          -o artifacts/publish

      - name: Install vpk
        run: dotnet tool install -g vpk

      # vpk builds a delta against the previous full package, which a fresh runner does not have.
      # Failure is expected for the first release on a channel.
      - name: Download the previous release as a delta base
        continue-on-error: true
        shell: bash
        run: |
          for pre in false true; do
            vpk download github --repoUrl "https://github.com/${{ github.repository }}" --token "${{ secrets.GITHUB_TOKEN }}" \
              --channel "${{ steps.meta.outputs.channel }}" --outputDir artifacts/releases --pre "$pre" \
              || echo "No previous release found (pre=$pre); this is fine."
          done

      - name: Pack
        shell: pwsh
        run: |
          $sign = @()
          if ($env:SIGNING_CERT_BASE64) {
            [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\cert.pfx", [Convert]::FromBase64String($env:SIGNING_CERT_BASE64))
            $sign = @('--signParams', "/f $env:RUNNER_TEMP\cert.pfx /p $env:SIGNING_CERT_PASSWORD /fd sha256 /tr http://timestamp.digicert.com /td sha256")
          } else {
            Write-Warning "No signing certificate configured; this build is unsigned and will trigger SmartScreen."
          }
          vpk pack `
            --packId MacCossLab.LabOps `
            --packVersion ${{ steps.meta.outputs.version }} `
            --packDir artifacts/publish `
            --mainExe LabOps.exe `
            --packTitle "LabOps" `
            --packAuthors "MacCoss Lab, University of Washington" `
            --icon src/LabOps.App/Assets/app.ico `
            --releaseNotes ${{ steps.notes.outputs.notes }} `
            --channel ${{ steps.meta.outputs.channel }} `
            --outputDir artifacts/releases `
            @sign
        env:
          SIGNING_CERT_BASE64: ${{ secrets.SIGNING_CERT_BASE64 }}
          SIGNING_CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}

      - name: Checksums
        shell: pwsh
        run: |
          $version = '${{ steps.meta.outputs.version }}'
          Get-ChildItem artifacts/releases -File |
            Where-Object { $_.Extension -ne '.nupkg' -or $_.Name -like "*-$version-*" } |
            Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "{0}  {1}" -f $_.Hash.ToLower(), (Split-Path $_.Path -Leaf) } |
            Set-Content artifacts/SHA256SUMS.txt
          Get-Content artifacts/SHA256SUMS.txt

      - name: Upload to GitHub Releases
        shell: pwsh
        run: |
          $arguments = @(
            'upload', 'github',
            '--repoUrl',     'https://github.com/${{ github.repository }}',
            '--token',       '${{ secrets.GITHUB_TOKEN }}',
            '--outputDir',   'artifacts/releases',
            '--channel',     '${{ steps.meta.outputs.channel }}',
            '--tag',         'v${{ steps.meta.outputs.version }}',
            '--releaseName', 'LabOps ${{ steps.meta.outputs.version }}',
            '--merge',
            '--publish'
          )
          if ('${{ steps.meta.outputs.prerelease }}' -eq 'true') { $arguments += '--pre' }
          vpk @arguments

      - name: Attach checksums and set the release description
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload v${{ steps.meta.outputs.version }} artifacts/SHA256SUMS.txt --clobber
          gh release edit v${{ steps.meta.outputs.version }} --notes-file ${{ steps.notes.outputs.notes }}
