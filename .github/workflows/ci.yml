# Build and test on every push and pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    env:
      # Set when a read-only deploy key for uw-maccosslab/LabOps-Quotes is stored as the
      # QUOTES_REPO_DEPLOY_KEY secret (see CLAUDE.md). With it, the tests also run the real quote
      # engine against the real quotes; without it, that one test skips.
      HAS_QUOTES_KEY: ${{ secrets.QUOTES_REPO_DEPLOY_KEY != '' }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET
        # Temporary, from 2026-10-25: Microsoft's origin storage, which setup-dotnet's bundled install
        # script reaches through aka.ms, answered HTTP 409 for every .NET download, while the CDN
        # served them. The current install script downloads from the CDN. Go back to
        # actions/setup-dotnet@v5 with dotnet-version: 10.0.x once the origin works again.
        shell: pwsh
        run: |
          Invoke-WebRequest https://builds.dotnet.microsoft.com/dotnet/scripts/v1/dotnet-install.ps1 -OutFile "$env:RUNNER_TEMP/dotnet-install.ps1"
          & "$env:RUNNER_TEMP/dotnet-install.ps1" -Channel 10.0 -Architecture x64 -AzureFeed https://builds.dotnet.microsoft.com/dotnet -InstallDir "$env:ProgramFiles/dotnet"
          "$env:ProgramFiles/dotnet" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          "DOTNET_ROOT=$env:ProgramFiles/dotnet" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Check out the quotes repository
        if: env.HAS_QUOTES_KEY == 'true'
        uses: actions/checkout@v7
        with:
          repository: uw-maccosslab/LabOps-Quotes
          ssh-key: ${{ secrets.QUOTES_REPO_DEPLOY_KEY }}
          path: LabOps-Quotes

      - name: Set up uv
        if: env.HAS_QUOTES_KEY == 'true'
        uses: astral-sh/setup-uv@v10.2.0

      - name: Build
        run: dotnet build LabOps.sln -c Release

      # The sync tests run real git against a local bare repository.
      - name: Test
        shell: pwsh
        run: |
          if ($env:HAS_QUOTES_KEY -eq 'true') { $env:SERVICES_QUOTES_REPO = "$env:GITHUB_WORKSPACE\LabOps-Quotes" }
          dotnet test --project src/LabOps.Tests/LabOps.Tests.csproj -c Release --no-build
