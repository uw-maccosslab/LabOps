# Build and test on every push and pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build ChargeState.sln -c Release

      # The sync tests run real git against a local bare repository; the real-engine test is
      # opt-in (SERVICES_QUOTES_REPO) and skips here.
      - name: Test
        run: dotnet test --project src/ChargeState.Tests/ChargeState.Tests.csproj -c Release --no-build
